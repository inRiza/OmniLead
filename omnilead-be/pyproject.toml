[project]
name = "omnilead-be"
version = "0.1.0"
description = "Backend OmniLead: connector Instagram (API resmi), handoff manual, antrean persetujuan, executor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "cryptography>=44",
]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnilead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
