[project]
name = "omnilead-agent"
version = "0.1.0"
description = "Service agen OmniLead: triage, orchestrator, guard. Hanya mengusulkan aksi; tidak pernah mengirim."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-adk>=1.0",
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnilead_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
